# Phase-2 config: same baseline settings, plus rare-class scan oversampling.
dataloader:
  batch_size: 2 # 4 for nuScenes and 2 for SemanticKITTI
  num_workers: 8 # set based on CPU cores (try 8-16)
  persistent_workers: true # effective only when num_workers > 0
  prefetch_factor: 2 # effective only when num_workers > 0
  rare_class_sampling:
    enable: true
    base_weight: 1.0
    max_weight: 8.0
    class_weights:
      bicycle: 2.0
      motorcycle: 4.0
      truck: 5.0
      other-vehicle: 3.0
      person: 1.5
      bicyclist: 2.0
      motorcyclist: 4.0
      other-ground: 2.0

augmentations:
  instance_cutmix: False # set True when Training if needed, False when validating (only for SemanticKITTI)

loss:
  lovasz: 1.0
  soft_pixel:
    enable: false # recommend true
    entropy_weight: false # recommend true
    min_weight: 0.05 # recommend 0.05
    confidence_threshold: null
    lovasz_on_confident_only: false
    boundary_on_confident_only: false

optim:
  lr: 0.001
  weight_decay: 0.003
  betas: [0.9, 0.999]
  eps: 0.00000001

scheduler:
  min_lr: 0.00001
  max_epoch: 120
  epoch_warmup: 8
  save_frequency: 0 # 0 disables periodic epoch saves
  val_frequency: 1 # 0 disables validation during training

mlflow:
  enable: true
  tracking_uri: "http://140.245.117.232:5000"
  experiment_name: "harpnext"
  run_name: "[train] harpnext_kitti_phase2_rare_sampler"
  nested: false
  log_checkpoints: false
  log_code_snapshot: false
